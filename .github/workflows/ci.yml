# Stage 0 CI — runs the same gates locally verified on untouched upstream code.
# Gate contract: green baseline at Stage 0; strictness ratchets in Stage 1+.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Mypy (types)
        run: python -m mypy server.py trace.py

      - name: Pytest (trace suite + golden fixture contracts)
        run: python -m pytest
