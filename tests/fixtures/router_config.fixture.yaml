# Golden-fixture router config (Stage 1 posture, Stage 3 pools).
# Used by tools/capture_golden.py to drive the hardened server against a
# deterministic stub upstream. Captures current behavior as the baseline
# contract for Stage 2+ contract tests.
#
# Posture notes (Stage 1):
#   - auth REQUIRED (bearer token via GOLDEN_ROUTER_KEY env) — negative-authz
#     fixtures 08/09 record the 401 path
#   - classifier tier disabled via /use: overrides in every scenario
#     (classifier endpoint points at the stub but is never called)
#
# Pool notes (Stage 3):
#   - three disjoint pools so each pool scenario starts at a fresh RR pointer
#   - the stub rate-limits poolkey-aaaa/cccc/dddd/eeee with retry-after: 1
#   - require_capabilities [fast] exercises the capability filter path
#
# Billing notes (Stage 4):
#   - stub usage is deterministic (5/6 openai, 7/6 anthropic) so costs pin
#     exactly: stub-complex 5@1.25 + 6@5.0 = 6+30 = 36 micros per request
#   - budget scenarios rely on stub-simple being free and stub-complex 36u
#
# Cost guard notes (Stage 5):
#   - vk-two-requests (principal, requests, 2): VK_D admitted exactly 2,
#     3rd request blocked pre-routing
#   - vk-token-budget (principal, tokens, 19): VK_E's 2nd request fits the
#     estimate-only sum (9+9=18) but not the reconciled window (11+9=20) —
#     the block IS the reconciliation proof
#   - guard-pool-one-request (pool, requests, 1): every pool identity gets
#     exactly one admit per window; guard_pool's 2nd request blocks at the
#     dispatch door
#   - global-requests (1000/60s) never fires in capture; pacer burst 50 >>
#     capture traffic so pace waits stay 0

server:
  host: 127.0.0.1
  port: 9902

auth:
  mode: required
  api_key_env: GOLDEN_ROUTER_KEY

ledger:
  enabled: true
  db_path: ledger.sqlite3

cost_guard:
  enabled: true
  estimate_chars_per_token: 4
  limiters:
    - name: vk-two-requests
      scope: principal
      requests: 2
      window_seconds: 3600
    - name: guard-pool-one-request
      scope: pool
      requests: 1
      window_seconds: 3600
    - name: vk-token-budget
      scope: principal
      tokens: 19
      window_seconds: 3600
    - name: global-requests
      scope: global
      requests: 1000
      window_seconds: 60
  pacer:
    requests_per_second: 100
    max_burst: 50
  watchdog:
    statuses: [401, 402]

pricing:
  default:
    input_per_mtok: 0.5
    output_per_mtok: 1.5
  entries:
    stub-simple:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      free: true
    stub-complex:
      input_per_mtok: 1.25
      output_per_mtok: 5.0
    stub-fallback:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      free: true
    stub-anthropic:
      input_per_mtok: 0.3
      output_per_mtok: 2.0

classifier:
  model: stub-classifier
  base_url: http://127.0.0.1:9901/v1
  session_timeout_minutes: 5
  zero_shot:
    enabled: false
  fasttext:
    enabled: false
  setfit:
    enabled: false

routing:
  override_prefix: '/use:'
  escalation_keywords: []
  de_escalation_keywords: []

key_pools:
  rotate_pool:
    default_cooldown_seconds: 1
    max_cooldown_seconds: 5
    keys:
      - ref: GOLDEN_POOL_KEY_A
        label: key-a
        capabilities: [fast]
      - ref: GOLDEN_POOL_KEY_B
        label: key-b
        capabilities: [fast, deep]
  exhaust_pool:
    default_cooldown_seconds: 1
    keys:
      - ref: GOLDEN_POOL_KEY_C
        label: key-c
      - ref: GOLDEN_POOL_KEY_D
        label: key-d
  stream_pool:
    default_cooldown_seconds: 1
    keys:
      - ref: GOLDEN_POOL_KEY_E
        label: key-e
      - ref: GOLDEN_POOL_KEY_F
        label: key-f
  guard_pool:
    default_cooldown_seconds: 1
    keys:
      - ref: GOLDEN_POOL_KEY_G
        label: key-g

categories:
  simple:
    label: Simple & Fast
    model: stub-simple
    base_url: http://127.0.0.1:9901/v1
    api_key_env: ''
    fallback_model: stub-fallback
    fallback_base_url: http://127.0.0.1:9901/v1
    fallback_key_env: ''
    timeout_seconds: 20
  complex:
    label: Complex & Smart
    model: stub-complex
    base_url: http://127.0.0.1:9901/v1
    api_key_env: ''
    timeout_seconds: 20
  anthropic:
    label: Anthropic protocol tier
    provider: anthropic
    model: stub-anthropic
    base_url: http://127.0.0.1:9901
    api_key_env: ''
    timeout_seconds: 20
    fallback_model: stub-fallback
    fallback_base_url: http://127.0.0.1:9901/v1
    fallback_provider: openai
    fallback_key_env: ''
  pooled:
    label: Pooled rotation tier
    model: stub-simple
    base_url: http://127.0.0.1:9901/v1
    key_pool: rotate_pool
    require_capabilities: [fast]
    timeout_seconds: 20
  pooled_exhaust:
    label: Pooled exhaustion tier
    model: stub-simple
    base_url: http://127.0.0.1:9901/v1
    key_pool: exhaust_pool
    timeout_seconds: 20
    fallback_model: stub-fallback
    fallback_base_url: http://127.0.0.1:9901/v1
    fallback_key_env: ''
  pooled_stream:
    label: Pooled streaming tier
    model: stub-simple
    base_url: http://127.0.0.1:9901/v1
    key_pool: stream_pool
    timeout_seconds: 20
  pooled_guard:
    label: Pooled cost-guard tier
    model: stub-simple
    base_url: http://127.0.0.1:9901/v1
    key_pool: guard_pool
    timeout_seconds: 20
