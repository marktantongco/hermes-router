# Stage 0 scaffold for the unified Hermes gateway fork.
# Upstream: kjames2001/hermes-router-proxy @ 0a9560e23d42d0faf6f89afd0fa947ad5b3aad88
# Policy: gates are calibrated GREEN on untouched upstream code; strictness
# ratchets up in Stage 1+ (ratchet inventory in docs/STAGE0_SOURCE_AUDIT.md).

[project]
name = "hermes-router-proxy"
version = "1.0.0"
description = "Unified Hermes gateway - v1.0.0 (Stage 8 freeze; fork of kjames2001/hermes-router-proxy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=48.0.1",
    # surrogate_models.py is imported unconditionally at boot (its classes
    # must exist for joblib deserialization), so these are runtime deps —
    # found and fixed while dogfooding install.sh at publication.
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
classifier = ["scikit-learn>=1.5", "sentence-transformers>=3.0"]
dev = ["pytest>=9.0.3", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", ".router", "traces", ".venv"]

[tool.ruff.lint]
# Stage-1 gate: real errors + pyflakes. The extended rule set
# (BLE001, I001, EXE001, RUF, UP, PLW, SIM, TRY - 42 findings on upstream
# code) is the documented ratchet debt; introduced per-stage.
# Ratchet R-L2 (server.py E731 x8) CLEARED in Stage 1.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Upstream code - each entry is a numbered ratchet item
# in docs/STAGE0_SOURCE_AUDIT.md (section 6, debt inventory).
"train_setfit.py" = ["E741"]        # R-L3: ambiguous variable names
"train_fasttext.py" = ["E741"]      # R-L3
"test_trace.py" = ["E741", "E402"]  # R-L4: upstream test suite, do not modify
"fasttext_classifier.py" = ["F401"] # R-L1: unused numpy import
"setfit_classifier.py" = ["F401"]   # R-L1: unused numpy import

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = false
check_untyped_defs = true
exclude = ["build", "dist", ".venv"]

[[tool.mypy.overrides]]
# Upstream surrogate_models.py:61 Optional model guard not expressed in
# types (ratchet R-M2)
module = "surrogate_models"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_trace.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
