# ═══════════════════════════════════════════════════════════════════════════
# Hermes Router Proxy Configuration — Example (Multi-Category Edition)
# ═══════════════════════════════════════════════════════════════════════════
#
# Copy this file to router_config.yaml and edit for your environment.
# Define any number of task categories. Each maps to a model + fallback chain.
# The classifier auto-detects the category from the user's message.
# Users can override with /use:<category-name> in their message.
#
# Legacy format (models: simple/complex) is auto-migrated on load.
# ═══════════════════════════════════════════════════════════════════════════

classifier:
  model: qwen2.5-0.5b-instruct-q8_0
  base_url: http://localhost:11434/v1
  api_key_env: ""

  surrogate:
    enabled: false
    path: .router/surrogate
    confidence_threshold: 0.85

  profile_hint: ""

  system_prompt: |
    Classify the user's message into exactly one of these categories:
    {categories}

    Reply with ONLY the category name, nothing else.

    "{message}" →

  session_timeout_minutes: 5

# ═══════════════════════════════════════════════════════════════════
# Provider adapters (Stage 2)
# ═══════════════════════════════════════════════════════════════════
# Each category (and each fallback) dispatches through a provider adapter
# selected by name. Unknown names refuse to start (fail-closed).
#
#   provider: openai      (default) any /v1/chat/completions upstream —
#                         OpenAI, Ollama, LM Studio, vLLM, llama.cpp.
#                         Aliases: ollama, lmstudio, vllm, llamacpp,
#                         openai_compat, openai-compatible.
#   provider: anthropic   Anthropic Messages API — full OpenAI <-> Anthropic
#                         translation incl. streaming SSE synthesis and tool
#                         calls. base_url is the HOST ROOT (the adapter
#                         appends /v1/messages), e.g. https://api.anthropic.com
#
# Fallbacks may cross protocols: set fallback_provider (and
# fallback2_provider) explicitly; unset inherits the primary's provider.
# `max_tokens_default` sets the mandatory Anthropic max_tokens when the
# client request does not carry max_tokens (default 4096).
# Introspect live resolution at GET /admin/providers (auth required).


# ═══════════════════════════════════════════════════════════════════════════
# Key pools (Stage 3) — 429-aware rotation over your own free-tier keys
# ═══════════════════════════════════════════════════════════════════════════
# A pool rotates several of YOUR OWN API keys for one endpoint. On HTTP 429
# the used key cools down for the duration taken from the provider's own
# retry headers (Retry-After seconds / HTTP-date, x-ratelimit-reset
# duration tokens), then a policy default bounded by max_cooldown_seconds.
# HTTP 401/403 quarantines the key until you fix the credential and reload
# (or POST /admin/pools/<name>/unlock). Round-robin over available keys;
# capability tags let categories filter (require_capabilities).
#
# References follow the Stage 1 rules: plain env names or ks:<alias>
# keystore aliases (fail-closed). Secrets are never exposed via admin or
# metrics surfaces. key ids ("<pool>/<label>") seed the Stage 4 ledger.
#
# key_pools:
#   free_tier:
#     strategy: round_robin            # only strategy in v1
#     default_cooldown_seconds: 60     # when no usable header is present
#     max_cooldown_seconds: 3600       # hard clamp on header-derived values
#     disable_on_auth_failure: true    # 401/403 -> quarantine (false: cooldown)
#     auth_failure_cooldown_seconds: 900
#     keys:
#       - ref: GROQ_KEY_1              # env name or ks:<alias>
#         label: groq-1
#         capabilities: [fast]
#       - ref: ks:groq2
#         label: groq-2
#         capabilities: [fast, vision]
#
# Category usage (mutually exclusive with api_key_env / alternate_key_env):
#
#   categories:
#     chat:
#       model: llama-3.3-70b-versatile
#       base_url: https://api.groq.com/openai/v1
#       key_pool: free_tier
#       require_capabilities: [fast]   # optional filter
#       fallback_key_pool: other_pool  # fallbacks may pool independently
#
# Inspect live state: GET /admin/pools (auth required).


# ═══════════════════════════════════════════════════════════════════════════
# Free-tier catalog (Stage 3) — optional, off by default
# ═══════════════════════════════════════════════════════════════════════════
# A data snapshot of the seven audited free tiers (Groq, Cerebras, Mistral,
# Google Gemini, OpenRouter, SambaNova, Nous portal) with base URLs,
# capability tags and documented limits. Categories can inherit provider
# facts via `catalog_ref: <name>`; explicit fields always win. The refresh
# job re-validates and atomically swaps the document; failures keep the
# last-good copy live and are counted in /metrics.
#
# catalog:
#   path: ""                    # default: bundled catalog/free_tiers.yaml
#   url: ""                     # optional remote snapshot (needs allow_remote)
#   allow_remote: false         # SECURITY: opt-in for remote pulls, no redirects
#   refresh_minutes: 0          # >0 schedules the background refresh job
#
# Inspect: GET /admin/catalog · force refresh: POST /admin/catalog/refresh
# (both auth required).


# ═══════════════════════════════════════════════════════════════════════════
# Task Categories — define as many as you need
# ═══════════════════════════════════════════════════════════════════════════
# Every model configured below (primary + fallbacks, across all categories)
# is listed by GET /v1/models — the OpenAI-compatible discovery surface
# Hermes agents and BYOM clients consume (Stage 7). See
# docs/HERMES_INTEGRATION.md for the agent onboarding guide.
categories:
  chat:
    label: "Chat & Trivia"
    model: deepseek-v4-flash
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    alternate_key_env: ""
    timeout_seconds: 120
    fallback_model: ""
    fallback_base_url: ""
    fallback_key_env: ""
    fallback_alternate_key_env: ""

  code:
    label: "Code & Debug"
    model: deepseek-v4-pro
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    alternate_key_env: ""
    timeout_seconds: 300
    fallback_model: ""
    fallback_base_url: ""
    fallback_key_env: ""
    fallback_alternate_key_env: ""

  # Example: Anthropic-protocol tier with a cross-protocol OpenAI fallback.
  # agent:
  #   label: "Agentic & Tools"
  #   provider: anthropic
  #   model: claude-sonnet-4-5
  #   base_url: https://api.anthropic.com
  #   api_key_env: ANTHROPIC_API_KEY
  #   max_tokens_default: 8192
  #   timeout_seconds: 300
  #   fallback_model: deepseek-v4-pro
  #   fallback_base_url: https://ollama.com/v1
  #   fallback_provider: openai
  #   fallback_key_env: OLLAMA_API_KEY

# ═══════════════════════════════════════════════════════════════════════════
# Keyword Deviation
# ═══════════════════════════════════════════════════════════════════════════
routing:
  escalation_keywords:
    - implement
    - debug
    - deploy
    - code
    - error
    - fix
    - configure
    - docker
    - kubernetes

  de_escalation_keywords:
    - thanks
    - hello
    - hi
    - ok
    - bye

  override_prefix: "/use:"

# ═══════════════════════════════════════════════════════════════════════════
# Stage 1: auth is MANDATORY. The server refuses to start unless a key is
# configured and resolvable. Opt out only for local development with
#   auth: { mode: disabled, api_key_env: '' }
# The key may be an environment-variable NAME or a keystore alias ('ks:<alias>'
# resolved from the encrypted store managed by `python -m keystore`).
auth:
  mode: required
  api_key_env: ROUTER_PROXY_API_KEY

server:
  port: 8766
  # Stage 1: localhost by default. Containers: set ROUTER_HOST=0.0.0.0
  # (the Dockerfile does this) — exposure is controlled by the port mapping.
  host: 127.0.0.1

persona:
  user_path: /root/.hermes/memories/USER.md
  memory_path: /root/.hermes/memories/MEMORY.md
  max_context_chars: 800

circuit_breaker:
  failure_threshold: 3
  recovery_timeout_sec: 30
  window_sec: 60

tracing:
  enabled: true
  path: .router/traces.jsonl
  max_input_chars: 500
  max_file_mb: 50
# ── Stage 4: billing plane ────────────────────────────────────────────────
# Immutable, hash-chained cost ledger (SQLite WAL). Every successful
# upstream completion appends one record (model, provider, key id,
# virtual-key attribution, token counts, integer micro-USD costs, and the
# exact price snapshot). Tamper-evident: GET /admin/ledger/verify, or
# offline `python -m ledger verify`.
#
#   hmac_key_env: optional env NAME or 'ks:<alias>' — turns the chain from
#     SHA-256 (corruption-evident) into HMAC-SHA256 (tamper-proof against
#     anyone without the secret).
ledger:
  enabled: true
  db_path: .router/ledger.sqlite3
  hmac_key_env: ''                # e.g. ROUTER_LEDGER_HMAC_KEY or ks:ledger-hmac

# Prices are integer-exact internally: USD per million tokens in, converted
# to nano-USD. Costs accumulate in micro-USD (no float drift). Models not
# listed use `default`; `free: true` entries record tokens at zero cost.
pricing:
  default:
    input_per_mtok: 0.5
    output_per_mtok: 1.5
  entries:
    glm-4.7:
      input_per_mtok: 0.6
      output_per_mtok: 2.2
    minimax-m2.7:
      input_per_mtok: 0.3
      output_per_mtok: 1.2
    some-free-model:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      free: true

# Virtual keys (subscriber attribution + blocking budgets):
#   POST   /admin/virtual_keys        {name, budget_mode, budget_limit, budget_period}
#   GET    /admin/virtual_keys        (with in-window spend)
#   PATCH  /admin/virtual_keys/{id}   {enabled?, budget_mode?, budget_limit?, budget_period?}
#   DELETE /admin/virtual_keys/{id}
#   GET    /admin/ledger/verify | /admin/ledger/records | /admin/ledger/summary?group_by=model|key|session|day
# budget_mode: none | tokens | cost_micros; budget_period: day | month | total.
# A virtual key whose in-window spend is >= its budget gets HTTP 402
# (budget_exceeded) BEFORE any upstream call. Virtual keys cannot access
# /admin/* or /metrics (403) — the gateway admin key remains all-powerful.

# ── Stage 5: cost guard ───────────────────────────────────────────────────
# Admission control between the budget gate and upstream dispatch. An absent
# section disables the guard entirely (zero behavior change).
#
# Limiters are true sliding windows in three scopes:
#   principal — per virtual key (the admin gateway key is exempt, mirroring
#               the Stage 4 budget gate)
#   pool      — per key-pool name, enforced at the pooled dispatch door (a
#               blocked attempt behaves like pool exhaustion: the cascade
#               advances with a synthetic 429)
#   global    — every request, admin included
# Each limiter sets exactly ONE dimension: `requests` (count) or `tokens`
# (estimated prompt tokens, reconciled to the upstream-reported total after
# completion — windows hold exact usage, not estimates). Blocked requests
# return HTTP 429 cost_guard_rate_limited with the limiter verdict in detail.
#
#   pacer    — token-bucket dispatch smoother: max_burst immediate admits,
#               then requests_per_second steady (keeps free-tier ceilings).
#   watchdog — records upstream 401/402 billing leaks; the /admin/costguard
#               report cross-checks completions against ledger appends
#               (billing_visibility: ok | leaking).
#
# Introspect live at GET /admin/costguard (auth required). Invalid
# configuration refuses startup / hot-reload (fail-closed).
cost_guard:
  enabled: true
  estimate_chars_per_token: 4      # prompt-token estimate: chars / this
  limiters:
    - name: per-key-rpm            # example: 30 requests / minute / key
      scope: principal
      requests: 30
      window_seconds: 60
    - name: per-key-tpm            # example: 60k tokens / minute / key
      scope: principal
      tokens: 60000
      window_seconds: 60
    - name: groq-free-rpd          # example: a free tier's daily ceiling
      scope: pool
      requests: 14400
      window_seconds: 86400
    - name: global-rps-safety
      scope: global
      requests: 600
      window_seconds: 60
  pacer:
    requests_per_second: 10
    max_burst: 20
  watchdog:
    statuses: [401, 402]

# ── Stage 6: alerting (operations plane) ─────────────────────────────────
# Rule-based alerting over the gateway's own surfaces, plus the operations
# dashboard (GET /dashboard, admin key — status cards, spend by model/key/
# day, virtual-key budgets, a paginated ledger browser, pool/circuit state).
# An absent section disables alerting (the dashboard still renders).
#
# Rules (each independently toggleable; unknown names refuse startup):
#   budget_threshold       warning at >= budget_warn_threshold of a virtual
#                          key's budget used, critical at >= critical (or
#                          already blocked 402)
#   pool_exhaustion        critical when a pool has keys but none available
#   circuit_open           warning per open circuit breaker
#   billing_leak           critical on cost-guard watchdog events (401/402)
#                          within billing_leak_window_seconds
#   ledger_append_failures critical when ledger appends have failed (billing
#                          visibility loss since boot)
#   ledger_verify          critical when the hash chain fails verification.
#                          DEFAULT OFF: full-chain O(n) scan per evaluation,
#                          cached until the record count changes
#
# Evaluation is pull-model: every GET /dashboard, /admin/status or
# /admin/alerts call evaluates all rules; transitions (raised / cleared)
# fire the webhook exactly once each. Poll /admin/status from your uptime
# checker to drive both the alerts and webhook delivery.
#
#   webhook_url            optional http(s) endpoint; POSTs
#                          {event: raised|cleared|test, alert: {...}}
#                          fail-soft (delivery never breaks a request;
#                          failures counted in /metrics)
#
# Introspect live at GET /admin/alerts; pipe check POST /admin/alerts/test.
# Invalid configuration refuses startup / hot-reload (fail-closed).
alerts:
  enabled: true
  budget_warn_threshold: 0.8      # warn at 80% of a budget consumed
  budget_critical_threshold: 1.0  # critical at 100% (or blocked)
  billing_leak_window_seconds: 900
  rules:
    budget_threshold: true
    pool_exhaustion: true
    circuit_open: true
    billing_leak: true
    ledger_append_failures: true
    ledger_verify: false          # opt-in: O(n) chain scan per evaluation
  webhook_url: ""                 # e.g. https://hooks.example.com/router
  webhook_timeout_seconds: 3.0
  history_limit: 100
